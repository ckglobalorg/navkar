<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navkar">
<meta name="description" content="Operation Navkar: ten agents, one ghost, one race.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Navkar</title>
<style>
:root{
  --bg:#05070f; --bg2:#0a1024; --ink:#eef0f7; --ink2:#a9b0c6; --ink3:#6d7590;
  --line:rgba(255,255,255,.075); --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --gold:#e8c36a; --gold2:#f9e6ad; --gold3:#a8812f;
  --up:#5fe3a1; --down:#ff6b7a; --warn:#ffb454;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.34,1.42,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(232,195,106,.10),transparent 60%),
   radial-gradient(90% 50% at 100% 30%,rgba(95,114,255,.08),transparent 65%),
   radial-gradient(80% 50% at 0% 80%,rgba(47,216,196,.05),transparent 60%),
   linear-gradient(180deg,#070a17 0%,#05070f 60%,#04050b 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(var(--safe-t) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(5,7,15,.92) 0%,rgba(5,7,15,.7) 70%,rgba(5,7,15,0));}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.brand b{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.upd{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:7px 11px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line)}
.upd i{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.upd.off i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.upd svg{width:13px;height:13px;opacity:.7}
.upd.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* scroller */
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;
  padding:calc(var(--safe-t) + 64px) 16px calc(var(--safe-b) + 104px)}
#scroller::-webkit-scrollbar{display:none}
#pull{will-change:transform}
#ptr{position:absolute;left:50%;top:calc(var(--safe-t) + 58px);width:34px;height:34px;margin-left:-17px;z-index:15;
  opacity:0;transform:translateY(-30px) scale(.6);pointer-events:none}
#ptr svg{width:34px;height:34px}
#ptr.go svg{animation:spin .8s linear infinite}
.offline{display:none;margin:0 auto 14px;width:max-content;max-width:100%;font-size:12.5px;color:var(--warn);padding:7px 13px;border-radius:999px;
  background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.2)}
.offline.on{display:block}

.view{display:none}
.view.on{display:block;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* hero */
.hero{text-align:center;padding:14px 0 6px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.total{font-size:clamp(46px,14vw,62px);line-height:1.05;margin:8px 0 6px;font-weight:500;
  background:linear-gradient(180deg,#fff7df 0%,var(--gold2) 30%,var(--gold) 65%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 28px rgba(232,195,106,.18))}
.total small{font-size:.55em;vertical-align:.32em;margin-right:2px;opacity:.85}
.delta{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.delta .pill{padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)}
.startline{display:inline-flex;align-items:center;gap:9px;margin-top:16px;font-size:13.5px;color:var(--gold2);
  padding:9px 16px;border-radius:999px;background:linear-gradient(90deg,rgba(232,195,106,.10),rgba(232,195,106,.04));border:1px solid rgba(232,195,106,.22)}
.beacon{position:relative;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.beacon::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--gold);animation:beacon 2.2s ease-out infinite}
@keyframes beacon{from{transform:scale(1);opacity:.7}to{transform:scale(3.4);opacity:0}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 10px}
.stat{padding:12px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink3);letter-spacing:.04em}

h2.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.01em}
h2.sec span{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.02em}

.panel{position:relative;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);
  box-shadow:0 20px 50px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}

/* race track */
.track{padding:34px 22px 14px;overflow:hidden}
.lanes{position:relative}
.mark{position:absolute;top:-24px;bottom:0;width:0;border-left:1px solid;pointer-events:none}
.mark b{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:600;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
.mark.floor{border-color:rgba(255,107,122,.55)} .mark.floor b{color:var(--down)}
.mark.start{border-left:1px dashed rgba(232,195,106,.55)} .mark.start b{color:var(--gold)}
.mark.t12{border-color:rgba(95,227,161,.35)} .mark.t12 b{color:var(--up)}
.mark.t18{border-color:rgba(95,227,161,.18)} .mark.t18 b{color:rgba(95,227,161,.7)}
.mark i{position:absolute;top:16px;bottom:0;left:-6px;width:12px;background:linear-gradient(90deg,transparent,rgba(255,107,122,.10),transparent)}
.lane{position:relative;height:34px}
.lane::before{content:"";position:absolute;left:-22px;right:-22px;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 12%,rgba(255,255,255,.07) 88%,transparent)}
.lane.ghostlane{margin-top:6px}
.lane.ghostlane::after{content:"";position:absolute;left:-22px;right:-22px;top:-4px;border-top:1px dashed rgba(207,216,255,.12)}
.lane .lname{position:absolute;left:-14px;top:50%;transform:translateY(-50%);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);opacity:.75;white-space:nowrap}
.runner{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;will-change:transform}
.runner .rdisc{position:absolute;left:-15px;top:2px;width:30px;height:30px;pointer-events:auto;cursor:pointer}
.trail{position:absolute;top:50%;height:2px;margin-top:-1px;border-radius:2px;transform:scaleX(0);will-change:transform}
.trail.on{transform:scaleX(1)}

/* medallion + emblem */
.medal{position:relative;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,var(--cg),var(--ca) 45%,rgba(8,11,24,.9) 78%);
  box-shadow:inset 0 0 0 1px var(--cb),inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px -8px var(--cg)}
.medal::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--cb);opacity:0;transform:scale(.92)}
.medal.hotring::after{animation:ring 1.6s cubic-bezier(.2,.8,.2,1) 2}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.5)}}
.medal svg{width:78%;height:78%;overflow:visible}
.medal.ghost{background:radial-gradient(circle at 35% 28%,rgba(207,216,255,.28),rgba(207,216,255,.07) 48%,rgba(8,11,24,.85) 78%)}

.emb{--sp:1}
.emb.hot{--sp:.42}
.emb *{transform-box:fill-box;transform-origin:center}
.emb [transform]{transform-box:view-box;transform-origin:0 0}
.emb .s{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.emb .s2{fill:none;stroke:var(--cl);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.emb .t{fill:none;stroke:var(--c);stroke-width:1.3;stroke-linecap:round;opacity:.55}
.emb .f{fill:var(--c)} .emb .fl{fill:var(--cl)} .emb .fa{fill:var(--ca2)} .emb .fw{fill:#fff}
.emb .sc{stop-color:var(--c)} .emb .scl{stop-color:var(--cl)} .emb .sc0{stop-color:var(--c);stop-opacity:0}
.emb.off *{animation-play-state:paused!important}

/* 1 momentum */
.mo-head{animation:moHead calc(2.6s*var(--sp)) ease-in-out infinite}
.mo-glow{animation:moGlow calc(2.6s*var(--sp)) ease-in-out infinite}
.mo-st{animation:moSt calc(1.8s*var(--sp)) linear infinite;opacity:0}
.mo-st.b{animation-delay:calc(-.6s*var(--sp))}.mo-st.c{animation-delay:calc(-1.2s*var(--sp))}
@keyframes moHead{0%,100%{transform:translate(0,0)}50%{transform:translate(1.2px,-1.2px)}}
@keyframes moGlow{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes moSt{0%{transform:translate(7px,-7px);opacity:0}25%{opacity:.95}100%{transform:translate(-9px,9px);opacity:0}}
/* 2 breakout */
.br-l{animation:brL calc(3s*var(--sp)) cubic-bezier(.5,0,.2,1) infinite}
.br-r{animation:brR calc(3s*var(--sp)) cubic-bezier(.5,0,.2,1) infinite}
.br-light{animation:brLight calc(3s*var(--sp)) ease-in-out infinite}
.br-arrow{animation:brArrow calc(3s*var(--sp)) cubic-bezier(.3,1.4,.5,1) infinite}
.br-bit{animation:brBit calc(3s*var(--sp)) ease-out infinite;opacity:0}
.br-bit.b{animation-name:brBit2}
@keyframes brL{0%,30%{transform:translate(0,0) rotate(0)}50%,80%{transform:translate(-1.8px,.6px) rotate(-4deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes brR{0%,30%{transform:translate(0,0) rotate(0)}50%,80%{transform:translate(1.8px,.6px) rotate(4deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes brLight{0%,30%{opacity:.1}50%,80%{opacity:1}100%{opacity:.1}}
@keyframes brArrow{0%,30%{transform:translateY(7px);opacity:.35}52%,80%{transform:translateY(-1px);opacity:1}100%{transform:translateY(7px);opacity:.35}}
@keyframes brBit{0%,40%{transform:translate(0,0);opacity:0}48%{opacity:1}75%,100%{transform:translate(-7px,-6px);opacity:0}}
@keyframes brBit2{0%,40%{transform:translate(0,0);opacity:0}48%{opacity:1}75%,100%{transform:translate(7px,-7px);opacity:0}}
/* 3 dip */
.dp-bird{transform-box:view-box!important;transform-origin:0 0!important;transform:translate(37px,13px) rotate(-38deg) scale(1.3);animation:dpBird calc(4.2s*var(--sp)) cubic-bezier(.45,0,.4,1) infinite}
.dp-touch{animation:dpTouch calc(4.2s*var(--sp)) ease-out infinite;opacity:.35}
.dp-wing{animation:dpWing calc(.5s*var(--sp)) ease-in-out infinite alternate}
@keyframes dpBird{0%{transform:translate(9px,9px) rotate(48deg) scale(1.3);opacity:0}8%{opacity:1}42%{transform:translate(21px,33px) rotate(30deg) scale(1.3)}50%{transform:translate(25px,34px) rotate(-10deg) scale(1.3)}62%{transform:translate(30px,26px) rotate(-38deg) scale(1.3)}88%{transform:translate(39px,11px) rotate(-40deg) scale(1.3);opacity:1}100%{transform:translate(42px,7px) rotate(-40deg) scale(1.3);opacity:0}}
@keyframes dpTouch{0%,40%{transform:scale(.6);opacity:.3}50%{transform:scale(1.8);opacity:1}75%,100%{transform:scale(1);opacity:.35}}
@keyframes dpWing{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
/* 4 results */
.rs-bar{transform-origin:50% 100%!important;animation:rsBar calc(3.2s*var(--sp)) cubic-bezier(.3,1.5,.5,1) infinite}
.rs-bar.b{animation-name:rsBarB}
.rs-spark{animation:rsSpark calc(3.2s*var(--sp)) ease-out infinite;opacity:0}
@keyframes rsBar{0%,12%{transform:scaleY(.25)}40%,82%{transform:scaleY(1)}100%{transform:scaleY(.25)}}
@keyframes rsBarB{0%,12%{transform:scaleY(.6)}40%,82%{transform:scaleY(1)}100%{transform:scaleY(.6)}}
@keyframes rsSpark{0%,36%{opacity:0;transform:scale(.2) rotate(0)}46%{opacity:1;transform:scale(1.2) rotate(45deg)}70%,100%{opacity:0;transform:scale(.4) rotate(90deg)}}
/* 5 quality */
.ql-shine{animation:qlShine calc(3.6s*var(--sp)) cubic-bezier(.5,0,.3,1) infinite}
.ql-spark{animation:qlSpark calc(3.6s*var(--sp)) ease-in-out infinite}
.ql-spark.b{animation-delay:calc(-1.8s*var(--sp))}
.ql-gem{animation:qlGem calc(3.6s*var(--sp)) ease-in-out infinite}
@keyframes qlShine{0%,25%{transform:translateX(-34px)}65%,100%{transform:translateX(34px)}}
@keyframes qlSpark{0%,40%,100%{transform:scale(0) rotate(0);opacity:0}55%{transform:scale(1.15) rotate(60deg);opacity:1}70%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes qlGem{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
/* 6 sector */
.sc-needle{transform-box:view-box!important;transform-origin:24px 24px!important;animation:scNeedle calc(5s*var(--sp)) cubic-bezier(.4,1.6,.5,1) infinite}
.sc-dial{transform-box:view-box!important;transform-origin:24px 24px!important;animation:spin calc(40s*var(--sp)) linear infinite}
@keyframes scNeedle{0%,100%{transform:rotate(-24deg)}22%{transform:rotate(18deg)}40%{transform:rotate(-9deg)}55%,85%{transform:rotate(38deg)}}
/* 7 big money */
.bm-body{animation:bmBody calc(3.4s*var(--sp)) ease-in-out infinite}
.bm-drop{animation:bmDrop calc(2.2s*var(--sp)) ease-out infinite;opacity:0}
.bm-drop.b{animation-delay:calc(-.7s*var(--sp))}.bm-drop.c{animation-delay:calc(-1.4s*var(--sp))}
.bm-wave{animation:bmWave calc(2.4s*var(--sp)) linear infinite}
.bm-tail{transform-origin:0% 60%!important;animation:bmTail calc(1.7s*var(--sp)) ease-in-out infinite alternate}
@keyframes bmBody{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.6px) rotate(-1.5deg)}}
@keyframes bmDrop{0%{transform:translateY(3px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-6px) scale(1);opacity:0}}
@keyframes bmWave{from{transform:translateX(0)}to{transform:translateX(-12px)}}
@keyframes bmTail{from{transform:rotate(-7deg)}to{transform:rotate(8deg)}}
/* 8 news */
.nw-wave{transform-box:view-box!important;transform-origin:31px 15px!important;animation:nwWave calc(2.4s*var(--sp)) ease-out infinite;opacity:0}
.nw-wave.b{animation-delay:calc(-.8s*var(--sp))}.nw-wave.c{animation-delay:calc(-1.6s*var(--sp))}
.nw-mer{animation:nwMer calc(4s*var(--sp)) ease-in-out infinite}
.nw-mer.b{animation-delay:calc(-2s*var(--sp))}
@keyframes nwWave{0%{transform:scale(.4);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes nwMer{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
/* 9 levels */
.lv-touch{animation:lvTouch calc(3s*var(--sp)) ease-out infinite;opacity:.3}
.lv-touch.b{animation-delay:calc(.35s*var(--sp))}.lv-touch.c{animation-delay:calc(.7s*var(--sp))}
.lv-up{animation:lvUp calc(3s*var(--sp)) cubic-bezier(.3,1.4,.5,1) infinite}
.lv-line{animation:lvLine calc(3s*var(--sp)) ease-in-out infinite}
@keyframes lvTouch{0%{transform:scale(.6);opacity:.3}12%{transform:scale(1.9);opacity:1}35%,100%{transform:scale(1);opacity:.45}}
@keyframes lvUp{0%,30%{transform:translate(-3px,3px);opacity:.25}55%,90%{transform:translate(0,0);opacity:1}100%{transform:translate(-3px,3px);opacity:.25}}
@keyframes lvLine{0%,100%{opacity:.55}50%{opacity:1}}
/* 10 delivery */
.dl-dial{transform-box:view-box!important;transform-origin:24px 24px!important;animation:dlDial calc(4.4s*var(--sp)) cubic-bezier(.6,0,.25,1.25) infinite}
.dl-bolt{animation:dlBolt calc(4.4s*var(--sp)) ease-in-out infinite;opacity:.45}
.dl-seal{animation:dlSeal calc(4.4s*var(--sp)) ease-in-out infinite}
@keyframes dlDial{0%,15%{transform:rotate(0)}40%,55%{transform:rotate(120deg)}80%,100%{transform:rotate(0)}}
@keyframes dlBolt{0%,45%{opacity:.4}58%,70%{opacity:1}90%,100%{opacity:.4}}
@keyframes dlSeal{0%,45%{transform:scale(1)}55%{transform:scale(1.25)}68%,100%{transform:scale(1)}}
/* ghost */
.gh-body{animation:ghFloat calc(5s*var(--sp)) ease-in-out infinite}
.gh-flick{animation:ghFlick calc(6.5s*var(--sp)) steps(1,end) infinite}
.gh-eyes{animation:ghEyes calc(7s*var(--sp)) cubic-bezier(.7,0,.3,1) infinite}
.gh-eye{animation:ghBlink calc(7s*var(--sp)) ease-in-out infinite}
.gh-shim{animation:ghShim calc(3.2s*var(--sp)) linear infinite}
.gh-hem{animation:bmWave calc(1.6s*var(--sp)) linear infinite}
@keyframes ghFloat{0%,100%{transform:translateY(0) skewX(0)}30%{transform:translateY(-2px) skewX(-2.5deg)}65%{transform:translateY(1px) skewX(2deg)}}
@keyframes ghFlick{0%{opacity:.92}58%{opacity:.35}59%{opacity:.9}61%{opacity:.5}62%{opacity:.92}88%{opacity:.7}89%{opacity:.92}}
@keyframes ghEyes{0%,38%{transform:translateX(0)}44%,70%{transform:translateX(2px)}76%,100%{transform:translateX(0)}}
@keyframes ghBlink{0%,88%,94%,100%{transform:scaleY(1)}91%{transform:scaleY(.08)}}
@keyframes ghShim{from{transform:translateY(-30px)}to{transform:translateY(30px)}}

/* agent cards */
.cards{display:grid;gap:10px}
.card{position:relative;overflow:hidden;padding:15px 15px 14px;border-radius:22px;cursor:pointer;
  background:radial-gradient(130% 90% at 0% 0%,var(--ca),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .35s var(--spring),border-color .3s;opacity:0;transform:translateY(16px)}
.card.in{animation:cardIn .7s cubic-bezier(.2,.9,.25,1) both;animation-delay:var(--dl,0ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.card:active{transform:scale(.975)!important}
.card.paused{filter:saturate(.55)}
.card .row{display:flex;align-items:center;gap:13px}
.card .medal{width:52px;height:52px;flex:0 0 52px}
.card .who{flex:1;min-width:0}
.card .who b{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:600;letter-spacing:.005em}
.card .who b em{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.08em}
.card .who p{margin:3px 0 0;font-size:12.8px;line-height:1.35;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .val{text-align:right}
.card .val b{display:block;font-family:var(--serif);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.card .val span{font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:999px;
  background:var(--glass2);color:var(--ink2);border:1px solid var(--line)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* trade bar */

.bar{position:relative;height:8px;margin:10px 0 6px;border-radius:99px;background:rgba(255,255,255,.06)}

.lock{display:inline-flex;align-items:center;gap:4px;color:var(--gold2);font-size:11px;font-weight:600}
.lock svg{width:11px;height:11px}

/* bottom tabs */
.tabs{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);z-index:30;height:64px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(14,18,36,.72);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.tabs .ind{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/4);border-radius:18px;
  background:linear-gradient(180deg,rgba(232,195,106,.18),rgba(232,195,106,.06));border:1px solid rgba(232,195,106,.25);

.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.04em;transition:color .3s}
.tab svg{width:22px;height:22px;transition:transform .45s var(--spring)}

.tab .badge{position:absolute;top:9px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--down);color:#fff;font-size:10px;line-height:16px;text-align:center;

.tab .badge.on{transform:scale(1)}

.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:320px;pointer-events:none;background:radial-gradient(70% 100% at 50% 0%,var(--ca),transparent 70%)}

.alert{display:flex;gap:13px;padding:15px;border-radius:20px;margin-bottom:10px;background:var(--glass);border:1px solid var(--line);opacity:0}

.alert.move .ic{background:rgba(232,195,106,.14);color:var(--gold2)}

.bline{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;opacity:0}

.empty{text-align:center;padding:34px 22px 30px}
.empty .art{position:relative;height:120px;margin:0 auto 14px;width:220px}
.empty .art .medal{position:absolute}
.empty h3{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:22px}
.empty p{margin:0 auto;max-width:300px;color:var(--ink2);font-size:14px;line-height:1.5}
.calm{display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(90deg,rgba(95,227,161,.08),rgba(255,255,255,.02));border:1px solid rgba(95,227,161,.22);margin-bottom:10px}
.calm svg{width:28px;height:28px;color:var(--up);flex:0 0 28px}
.calm b{display:block;font-size:15px}
.calm span{font-size:13px;color:var(--ink2)}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin:16px 0 14px}
.seg .si{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:rgba(255,255,255,.09);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s var(--spring)}

.hrow{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:18px;margin-bottom:9px;overflow:hidden;opacity:0;
  background:var(--glass);border:1px solid var(--line)}
.hrow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0}

.hrow.win::before{background:var(--up);box-shadow:0 0 12px var(--up)}
.hrow.loss{background:linear-gradient(90deg,rgba(255,107,122,.06),rgba(255,255,255,.015) 60%)}

.hrow .medal{width:36px;height:36px;flex:0 0 36px}
.hrow .mid{flex:1;min-width:0}
.hrow .sym{font-weight:700;font-size:14.5px;letter-spacing:.03em}
.hrow .sym span{font-weight:500;color:var(--ink3);font-size:12px;letter-spacing:0;margin-left:6px}
.hrow .sub{font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .res{text-align:right}
.hrow .res b{display:block;font-family:var(--serif);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}

.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--glass2);color:var(--ink2);margin-left:6px;vertical-align:1px}

.rl{display:flex;gap:16px;padding:18px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);margin-bottom:10px;opacity:0}
.rl .n{flex:0 0 auto;font-family:var(--serif);font-size:30px;line-height:1;width:26px;text-align:center;
  background:linear-gradient(180deg,var(--gold2),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.rl b{display:block;font-size:15.5px;margin-bottom:4px;font-weight:650}

.oath{margin:20px 4px 6px;padding:18px;border-radius:20px;text-align:center;font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--gold2);
  background:radial-gradient(100% 120% at 50% 0%,rgba(232,195,106,.10),transparent 70%);border:1px solid rgba(232,195,106,.2)}
.foot{text-align:center;color:var(--ink3);font-size:11.5px;margin:22px 0 4px;letter-spacing:.04em}

@media (min-width:700px){
  #scroller{padding-left:24px;padding-right:24px}
  .tabs{left:50%;right:auto;width:420px;margin-left:-210px}
}
@media (prefers-reduced-motion:reduce){
  .emb *,.beacon::after,.medal::after{animation:none!important}

  .tabs .ind,.seg .si,.tab svg,.bar .fill,.bar .now,.vsbar i,.prog i,.trail{transition:opacity .3s!important}

}

</style>

function setSheet(x){sp.x=x;sheet.style.transform="translate3d(0,"+x.toFixed(2)+"px,0)";scrim.style.opacity=String(Math.max(0,Math.min(1,1-x/sp.H)))}

  var k=340,c=2*Math.sqrt(k)*.86,last=performance.now();

    sp.raf=requestAnimationFrame(step)}

}

function sheetHTML(a){

  if(!a.open.length)h+='<div class="muted" style="padding:0 2px">'+(a.status==="paused"?"Paused. No new buys until its losers are reviewed.":ghost?"Nothing open. The ghost buys only when an agent buys.":"Nothing open. It buys only when its rule fires, at most one stock a day.")+'</div>';
  a.open.forEach(function(o){var held=daysBetween(o.since,D.day&&D.day>today?D.day:today);if(held!=null&&held<0)held=0;
    h+='<div class="otrade" style="'+vars(a.id)+'">'+tradeBar(o)+'<div class="grid4"><div>Bought<b>'+rs2(o.entry)+'</b></div><div>Stop<b>'+rs2(o.stop)+'</b></div><div>Lock<b>'+(num(o.lock)>=2?"+12%":num(o.lock)>=1?"+6%":"Not yet")+'</b></div><div>Held<b>'+(held==null?"—":held+(held===1?" day":" days"))+'</b></div></div>'+
      (o.exit_pending?'<div class="chips"><span class="chip sell"><i></i>Sell pending · reply when done</span></div>':'')+'</div>'});
  if(!ghost){

    function vb(v,c){v=num(v);var w=Math.abs(v)/mx*50;return '<i style="'+(v>=0?"left:50%":"right:50%")+';width:'+w.toFixed(2)+'%;transform-origin:'+(v>=0?"0":"100%")+' 50%;background:'+c+'"></i>'}
    h+='<div class="h4">You vs the ghost</div><div class="vs">'+
      '<div class="vsrow"><span class="nm">'+emblem(a.id,22)+esc(a.name.split(" ")[0])+'</span><div class="vsbar">'+(a.avg_pct==null?"":vb(a.avg_pct,(META[a.id]||META.G).c))+'</div><span class="v '+(a.avg_pct==null?"":cls(a.avg_pct))+'">'+(a.avg_pct==null?"—":pct(a.avg_pct))+'</span></div>'+
      '<div class="vsrow"><span class="nm">'+emblem("G",22)+'Ghost</span><div class="vsbar">'+(g.avg_pct==null?"":vb(g.avg_pct,"#cfd8ff"))+'</div><span class="v '+(g.avg_pct==null?"":cls(g.avg_pct))+'">'+(g.avg_pct==null?"—":pct(g.avg_pct))+'</span></div>'+
      '<div class="vsnote '+gv.k+'" style="color:var(--ink2)">'+esc(gv.t)+'</div>'+
      '<div class="prog"><i data-k="'+Math.min(1,a.closed/30).toFixed(3)+'"></i></div><div class="muted" style="margin-top:6px;font-size:11.5px">'+a.closed+' of 30 closed trades toward earning more money</div></div>';
  }
  var mine=D.history.filter(function(t){return t.agent===a.id});
  h+='<div class="h4">Closed trades</div>';
  if(!mine.length)h+='<div class="muted" style="padding:0 2px">None yet.</div>';
  mine.forEach(function(t){var win=num(t.net)>0;h+='<div class="hrow '+(win?"win":"loss")+'" style="'+vars(t.agent)+'"><div class="mid"><div class="sym">'+esc(t.symbol)+'<span>'+dShort(t.entry_date)+' → '+dShort(t.exit_date)+'</span></div><div class="sub">'+esc(reasonText(t.reason))+' · '+rs2(t.entry)+' → '+rs2(t.exit)+'</div></div><div class="res"><b class="'+cls(t.pct)+'">'+pct(t.pct)+'</b><span class="'+cls(t.net)+'">'+srs(t.net)+'</span></div></div>'});

// drag to close
(function(){
  var y0=null,x0=0,t0=0,lastY=0,lastT=0,vel=0,dragging=false;
  function down(e){var p=e.touches?e.touches[0]:e,fromGrab=e.currentTarget===$("grab");if(!fromGrab&&sbody.scrollTop>0)return;y0=p.clientY;x0=sp.x;lastY=y0;lastT=performance.now();vel=0;dragging=fromGrab}
  function move(e){if(y0==null)return;var p=e.touches?e.touches[0]:e,dy=p.clientY-y0;
    if(!dragging){if(dy>6&&sbody.scrollTop<=0)dragging=true;else if(dy<-4){y0=null;return}else return}
    if(e.cancelable)e.preventDefault();cancelAnimationFrame(sp.raf);
    var now=performance.now();vel=(p.clientY-lastY)/Math.max(1,now-lastT)*1000;lastY=p.clientY;lastT=now;
    var x=x0+dy;if(x<0)x=x*.25;if(REDUCED){sheet.style.opacity=String(1-Math.max(0,x)/sp.H)}else setSheet(x)}
  function up(){if(y0==null)return;var was=dragging;y0=null;dragging=false;if(!was)return;
    if(REDUCED){var dy=lastY-(lastY-0);if(sheet.style.opacity<.75)closeSheet();else sheet.style.opacity="1";return}
    if(sp.x>sp.H*.22||vel>700)closeSheet(Math.max(vel,600));else runSpring(0,vel)}
  [$("grab"),sbody].forEach(function(el){el.addEventListener("touchstart",down,{passive:true});el.addEventListener("touchmove",move,{passive:false});el.addEventListener("touchend",up);el.addEventListener("touchcancel",up)});
  $("grab").addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"){down(e);var mv=function(ev){move(ev)},u=function(){up();removeEventListener("pointermove",mv);removeEventListener("pointerup",u)};addEventListener("pointermove",mv);addEventListener("pointerup",u)}});
  scrim.addEventListener("click",function(){closeSheet()});$("closeBtn").addEventListener("click",function(){closeSheet()});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&root.classList.contains("open"))closeSheet()});
})();

// ---------------------------------------------------------------- tabs, taps
var ORDER=["arena","today","history","rules"];
function show(v){if(v===view)return;view=v;var i=ORDER.indexOf(v);document.querySelector(".tabs .ind").style.setProperty("--i",i);
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){t.classList.toggle("on",t.getAttribute("data-v")===v)});
  ORDER.forEach(function(o){var el=$("v-"+o);el.classList.toggle("on",o===v)});$("scroller").scrollTop=0;
  var el=$("v-"+v);Array.prototype.forEach.call(el.querySelectorAll(".in"),function(x){x.classList.remove("in");void x.offsetWidth;x.classList.add("in")});

}

document.addEventListener("click",function(e){
  var s=e.target.closest("#seg button");if(s){hsel=+s.getAttribute("data-h");renderHistory();return}

var loading=false;

  if(loading)return Promise.resolve();loading=true;$("upd").classList.add("spin");
  return fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);fromCache=r.headers.get("x-navkar-cache")==="1";return r.json()})
    .then(function(j){D=normalise(j);if(!fromCache){try{localStorage.setItem("navkar:data",JSON.stringify(j))}catch(e){}}})
    .catch(function(){fromCache=true;var s=null;try{s=localStorage.getItem("navkar:data")}catch(e){}D=normalise(s?JSON.parse(s):null)})
    .then(function(){loading=false;$("upd").classList.remove("spin");renderAll()});

(function(){
  var sc=$("scroller"),pull=$("pull"),ptr=$("ptr"),arc=$("ptrArc"),y0=null,d=0,busy=false,MAX=72;
  function set(px,anim){var k=Math.min(1,px/MAX);pull.style.transition=anim?"transform .5s cubic-bezier(.3,1.3,.5,1)":"none";ptr.style.transition=anim?"transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s":"none";
    pull.style.transform=px?"translate3d(0,"+px+"px,0)":"";ptr.style.opacity=String(k);ptr.style.transform="translateY("+(px*.55-30)+"px) scale("+(.6+.4*k)+") rotate("+(px*3)+"deg)";arc.setAttribute("stroke-dashoffset",String(56.5*(1-k*.85)))}
  sc.addEventListener("touchstart",function(e){if(sc.scrollTop<=0&&!busy)y0=e.touches[0].clientY;else y0=null},{passive:true});
  sc.addEventListener("touchmove",function(e){if(y0==null)return;var dy=e.touches[0].clientY-y0;if(dy<=0){d=0;set(0);return}d=Math.min(130,dy*.5);set(d)},{passive:true});
  sc.addEventListener("touchend",function(){if(y0==null)return;y0=null;
    if(d>=MAX){busy=true;set(MAX*.8,true);ptr.classList.add("go");var t0=Date.now();load().then(function(){setTimeout(function(){ptr.classList.remove("go");set(0,true);busy=false},Math.max(0,600-(Date.now()-t0)))})}
    else set(0,true);d=0});
})();

// ---------------------------------------------------------------- starfield
(function(){
  var cv=$("sky"),cx=cv.getContext("2d"),W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1),stars=[],motes=[],raf=0,last=0;
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    stars=[];var n=Math.round(W*H/5200);for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.05+.2,p:Math.random()*6.28,s:.4+Math.random()*1.4,b:Math.random()<.12});
    motes=[];for(var j=0;j<16;j++)motes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.6,v:6+Math.random()*12,p:Math.random()*6.28});
    if(REDUCED)draw(0)}
  function draw(t){cx.clearRect(0,0,W,H);var s=t/1000;
    for(var i=0;i<stars.length;i++){var a=stars[i],al=.25+.55*(.5+.5*Math.sin(s*a.s+a.p));cx.globalAlpha=al;cx.fillStyle=a.b?"#ffe7b0":"#cfd6ff";cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill()}
    for(var j=0;j<motes.length;j++){var m=motes[j];var y=((m.y-s*m.v)%H+H)%H,x=m.x+Math.sin(s*.3+m.p)*14;var g=cx.createRadialGradient(x,y,0,x,y,m.r*5);g.addColorStop(0,"rgba(240,205,120,.55)");g.addColorStop(1,"rgba(240,205,120,0)");cx.globalAlpha=.5+.5*Math.sin(s*.8+m.p);cx.fillStyle=g;cx.beginPath();cx.arc(x,y,m.r*5,0,6.283);cx.fill()}
    cx.globalAlpha=1}
  function loop(t){raf=requestAnimationFrame(loop);if(t-last<33)return;last=t;draw(t)}
  function start(){if(REDUCED||raf)return;raf=requestAnimationFrame(loop)}
  function stop(){cancelAnimationFrame(raf);raf=0}
  size();addEventListener("resize",function(){size()});
  document.addEventListener("visibilitychange",function(){document.hidden?stop():start()});
  if("requestIdleCallback" in window)requestIdleCallback(start);else setTimeout(start,200);
})();
